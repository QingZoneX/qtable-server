version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # QTable is an application: dependency PRs intentionally raise the reviewed
    # minimum version rather than materializing a transitive lock here.
    versioning-strategy: increase
    # requirements.txt is only a pip-compatible shim to requirements.in.
    # Scanning both files made Dependabot rewrite the shim as a fully resolved
    # transitive requirements file, which conflicts with the repository policy.
    exclude-paths:
      - "requirements.txt"
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # pydantic-ai 2.x removed the legacy Agent retry kwargs used by
      # app/services/ai_tool_router.py. Re-enable major updates after the
      # router is migrated to Agent(retries={"output": ..., "tools": ...}).
      - dependency-name: "pydantic-ai-slim"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
