# Docker Hub consumer stack for QTable.
#
# Application images are pulled from Docker Hub instead of building QTable/QTableUI
# source trees locally. PostgreSQL/Redis use their upstream images. The pinned MinIO
# helper is built from this repository so attachment behavior stays aligned with the
# canonical source Compose stack until a separately governed object-storage image is
# adopted. Operators may point QTable at an external S3-compatible service instead.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-qtable}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${QTABLE_INTERNAL_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-qtable}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${QTABLE_INTERNAL_BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
      args:
        MINIO_VERSION: ${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    environment:
      MINIO_ROOT_USER: ${ATTACHMENT_S3_ACCESS_KEY:?ATTACHMENT_S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${ATTACHMENT_S3_SECRET_KEY:?ATTACHMENT_S3_SECRET_KEY must be set}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    ports:
      - "${QTABLE_INTERNAL_BIND_HOST:-127.0.0.1}:${MINIO_API_HOST_PORT:-9001}:9000"
      - "${QTABLE_INTERNAL_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9002}:9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9000/minio/health/live >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  qtable:
    image: ${QTABLE_IMAGE:-qingzonex/qtable:0.1.0-alpha}
    environment:
      # Registry distribution is a production deployment path. Keep this fixed so
      # copying the development-oriented .env.example cannot weaken startup checks.
      APP_ENV: production
      DATABASE_MODE: postgres
      DATA_BACKEND: db
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-qtable}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      JWT_ISSUER: ${JWT_ISSUER:-qtable}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-qingzone}
      JWT_ACCEPT_LEGACY_TOKENS: ${JWT_ACCEPT_LEGACY_TOKENS:-false}
      OAUTH_ALLOW_PLAIN_PKCE: "false"
      OAUTH_ALLOW_DYNAMIC_CLIENT_REGISTRATION: "false"
      QTABLE_WEB_URL: ${QTABLE_WEB_URL:-http://localhost:9100}
      RESET_TOKEN_EXPIRE_MINUTES: ${RESET_TOKEN_EXPIRE_MINUTES:-30}
      RESET_PASSWORD_URL_BASE: ${RESET_PASSWORD_URL_BASE:-http://localhost:9100/reset-password}
      PASSWORD_RESET_DEBUG_TOKEN_ENABLED: "false"
      PASSWORD_RESET_RATE_LIMIT_ENABLED: "true"
      PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_SECONDS:-900}
      PASSWORD_RESET_FORGOT_EMAIL_LIMIT: ${PASSWORD_RESET_FORGOT_EMAIL_LIMIT:-5}
      PASSWORD_RESET_SUBMIT_TOKEN_LIMIT: ${PASSWORD_RESET_SUBMIT_TOKEN_LIMIT:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ATTACHMENT_STORAGE_ENABLED: ${ATTACHMENT_STORAGE_ENABLED:-true}
      ATTACHMENT_S3_ENDPOINT: ${ATTACHMENT_S3_COMPOSE_ENDPOINT:-minio:9000}
      ATTACHMENT_S3_ACCESS_KEY: ${ATTACHMENT_S3_ACCESS_KEY:?ATTACHMENT_S3_ACCESS_KEY must be set}
      ATTACHMENT_S3_SECRET_KEY: ${ATTACHMENT_S3_SECRET_KEY:?ATTACHMENT_S3_SECRET_KEY must be set}
      ATTACHMENT_S3_BUCKET: ${ATTACHMENT_S3_BUCKET:-qtable}
      ATTACHMENT_S3_REGION: ${ATTACHMENT_S3_REGION:-}
      ATTACHMENT_S3_SECURE: ${ATTACHMENT_S3_COMPOSE_SECURE:-false}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-52428800}
      ATTACHMENT_CLEANUP_BATCH_SIZE: ${ATTACHMENT_CLEANUP_BATCH_SIZE:-100}
      ATTACHMENT_CLEANUP_INTERVAL_SECONDS: ${ATTACHMENT_CLEANUP_INTERVAL_SECONDS:-60}
      ATTACHMENT_UPLOAD_PENDING_GRACE_SECONDS: ${ATTACHMENT_UPLOAD_PENDING_GRACE_SECONDS:-3600}
      QTABLE_RUN_MIGRATIONS: ${QTABLE_RUN_MIGRATIONS:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${QTABLE_INTERNAL_BIND_HOST:-127.0.0.1}:${QTABLE_API_PORT:-9000}:9000"
    restart: unless-stopped

  qtable-ui:
    image: ${QTABLE_UI_IMAGE:-qingzonex/qtable-ui:0.1.0-alpha}
    environment:
      PORT: 9100
      QTABLE_HOST: qtable
      QTABLE_PORT: 9000
    depends_on:
      qtable:
        condition: service_healthy
    ports:
      - "${QTABLE_UI_BIND_HOST:-0.0.0.0}:${QTABLE_UI_PORT:-9100}:9100"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
